<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Стабільний Barcode Scanner</title>
  <style>
    body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .scanner-wrapper {
      position: relative;
      width: 100vw;
      max-width: 480px;
      height: 60vh;
      overflow: hidden;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Рамка прицілу */
    .viewfinder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 35%;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
      border: 2px solid #00ff66;
      border-radius: 8px;
      pointer-events: none;
    }
    .controls {
      padding: 16px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 16px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    #result-box {
      margin: 10px 16px;
      padding: 12px;
      background: #1e1e1e;
      border-radius: 6px;
      width: calc(100% - 64px);
      max-width: 448px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="scanner-wrapper">
    <video id="camera-stream" playsinline muted></video>
    <div class="viewfinder"></div>
  </div>

  <div class="controls">
    <button id="toggle-torch" style="display:none;">Увімкнути ліхтарик</button>
  </div>

  <div id="result-box">Наведіть камеру на штрихкод або QR-код</div>

  <script type="module">
    import { BarcodeDetectorPolyfill } from "https://cdn.jsdelivr.net/npm/@undecaf/barcode-detector-polyfill@0.9.21/dist/index.min.js";

    // 1. Ініціалізація поліфілу, якщо браузер не підтримує нативний API
    if (!('BarcodeDetector' in window)) {
      window.BarcodeDetector = BarcodeDetectorPolyfill;
      console.info("Застосовано WASM BarcodeDetector polyfill");
    }

    const video = document.getElementById('camera-stream');
    const resultBox = document.getElementById('result-box');
    const torchBtn = document.getElementById('toggle-torch');

    let stream = null;
    let track = null;
    let detector = null;
    let isScanning = false;
    let torchState = false;

    // Механізм Multi-Frame валідації для відсікання "обрізаних" 1D-кодів
    let lastCandidate = null;
    let candidateMatches = 0;
    const CONFIRMATION_THRESHOLD = 2; // Потрібно 2 однакових розпізнавання поспіль

    async function initDetector() {
      // Суворе обмеження необхідних форматів
      const targetFormats = ['qr_code', 'ean_13', 'code_128', 'code_39', 'upc_a'];
      
      const supported = await window.BarcodeDetector.getSupportedFormats();
      const formats = targetFormats.filter(f => supported.includes(f));

      detector = new window.BarcodeDetector({ formats });
    }

    async function startCamera() {
      const constraints = {
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 },
          advanced: [{ focusMode: "continuous" }]
        }
      };

      try {
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        await video.play();

        track = stream.getVideoTracks()[0];
        checkTorchSupport(track);

        isScanning = true;
        scanLoop();
      } catch (err) {
        resultBox.textContent = `Помилка доступу до камери: ${err.message}`;
      }
    }

    function checkTorchSupport(videoTrack) {
      const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
      if (capabilities.torch) {
        torchBtn.style.display = 'inline-block';
        torchBtn.addEventListener('click', async () => {
          torchState = !torchState;
          await videoTrack.applyConstraints({ advanced: [{ torch: torchState }] });
          torchBtn.textContent = torchState ? "Вимкнути ліхтарик" : "Увімкнути ліхтарик";
        });
      }
    }

    async function scanLoop() {
      if (!isScanning) return;

      if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
        try {
          const barcodes = await detector.detect(video);
          
          if (barcodes.length > 0) {
            handleDetection(barcodes[0]);
          } else {
            // Скидаємо лічильник при втраті коду з кадру
            candidateMatches = 0;
            lastCandidate = null;
          }
        } catch (err) {
          console.warn("Помилка кадру:", err);
        }
      }

      // 60-100 мс інтервал між кадрами захищає CPU від перегріву та тротлінгу
      setTimeout(() => requestAnimationFrame(scanLoop), 80);
    }

    function handleDetection(barcode) {
      const { rawValue, format } = barcode;

      // Для QR-кодів валідація не потрібна (мають нативні чексуми Reed-Solomon)
      if (format === 'qr_code') {
        renderSuccess(rawValue, format);
        return;
      }

      // Для 1D-штрихкодів перевіряємо стабільність зчитування послідовних кадрів
      if (rawValue === lastCandidate) {
        candidateMatches++;
        if (candidateMatches >= CONFIRMATION_THRESHOLD) {
          renderSuccess(rawValue, format);
        }
      } else {
        lastCandidate = rawValue;
        candidateMatches = 1;
      }
    }

    function renderSuccess(value, format) {
      resultBox.innerHTML = `<strong>Зчитано:</strong> ${value}<br><small>Формат: ${format}</small>`;
      // За необхідності тут можна зробити паузу або вібрацію
      if (navigator.vibrate) navigator.vibrate(50);
    }

    // Запуск
    initDetector().then(startCamera);
  </script>
</body>
</html>
